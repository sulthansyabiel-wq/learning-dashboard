<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart | Media Pembelajaran Interaktif</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            transition: all 0.2s ease-in-out;
        }
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.2s ease;
        }
        /* Animasi Hover untuk Card */
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }
        /* Animasi tombol */
        .btn-animate {
            transition: all 0.2s ease;
        }
        .btn-animate:hover {
            transform: scale(1.02);
        }
        .btn-animate:active {
            transform: scale(0.98);
        }
        /* Animasi fade in untuk konten */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeInUp 0.3s ease forwards;
        }
        /* Progress bar animasi */
        .progress-fill {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Hover pada item materi */
        .materi-item:hover {
            background-color: rgba(59, 130, 246, 0.05);
            border-left-width: 4px;
            border-left-color: #3b82f6;
        }
        /* Animasi untuk quiz option */
        .quiz-option {
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .quiz-option:hover {
            transform: translateX(4px);
            background-color: #f3f4f6;
        }
        html.dark .quiz-option:hover {
            background-color: #374151;
        }
        /* Dark mode transition */
        html.dark {
            color-scheme: dark;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-chalkboard-user text-white text-sm"></i>
                    </div>
                    <span class="font-bold text-xl">EduSmart</span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="userName" class="text-sm text-gray-600 dark:text-gray-300">Sulthan</span>
                    <button id="darkModeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 btn-animate">
                        <i id="darkIcon" class="fas fa-moon text-gray-700 dark:text-gray-300"></i>
                    </button>
                    <button id="logoutBtn" class="px-3 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 btn-animate">
                        <i class="fas fa-sign-out-alt mr-1"></i> Keluar
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tab Navigation -->
        <div class="flex gap-2 border-b border-gray-200 dark:border-gray-700 mb-6">
            <button id="tabDashboard" class="tab-btn px-4 py-2 text-sm font-medium rounded-t-lg transition-all data-[active=true]:border-b-2 data-[active=true]:border-blue-600 data-[active=true]:text-blue-600 dark:data-[active=true]:text-blue-400">
                <i class="fas fa-tachometer-alt mr-1"></i> Dashboard
            </button>
            <button id="TabMateri" class="tab-btn px-4 py-2 text-sm font-medium rounded-t-lg transition-all">
                <i class="fas fa-book-open mr-1"></i> Materi
            </button>
            <button id="tabQuiz" class="tab-btn px-4 py-2 text-sm font-medium rounded-t-lg transition-all">
                <i class="fas fa-puzzle-piece mr-1"></i> Kuis
            </button>
            <button id="tabPortfolio" class="tab-btn px-4 py-2 text-sm font-medium rounded-t-lg transition-all">
                <i class="fas fa-id-card mr-1"></i> Portofolio
            </button>
        </div>

        <!-- Content Area -->
        <div id="contentArea" class="fade-in"></div>
    </div>

    <script>
        // ==================== DATA ====================
        let currentUser = { name: "Sulthan", level: 3, xp: 240, avatar: null };
        let completedLessons = [true, true, false, false, false]; // 5 materi
        let quizScore = 0;
        let quizAnswers = {};

        const materiList = [
            { id: 1, title: "Pengantar HTML", desc: "Dasar-dasar struktur web", xp: 20, videoUrl: "https://www.youtube.com/embed/UB1O30fR-EE", completed: true },
            { id: 2, title: "CSS Dasar", desc: "Styling halaman web", xp: 20, videoUrl: "https://www.youtube.com/embed/1PnVor36_40", completed: true },
            { id: 3, title: "JavaScript Fundamental", desc: "Logika dan interaktivitas", xp: 20, videoUrl: "https://www.youtube.com/embed/W6NZfCO5SIk", completed: false },
            { id: 4, title: "Tailwind CSS", desc: "Utility-first framework", xp: 20, videoUrl: "https://www.youtube.com/embed/lCxcTsOHrjo", completed: false },
            { id: 5, title: "React JS Dasar", desc: "Membangun UI modern", xp: 20, videoUrl: "https://www.youtube.com/embed/SqcY0GlETPk", completed: false }
        ];

        const quizQuestions = [
            { id: 1, question: "Apa kepanjangan dari HTML?", options: ["Hyper Text Markup Language", "High Tech Modern Language", "Hyper Transfer Markup Language", "Home Tool Markup Language"], correct: 0 },
            { id: 2, question: "CSS digunakan untuk...", options: ["Struktur halaman", "Styling halaman", "Database", "Backend logic"], correct: 1 },
            { id: 3, question: "JavaScript adalah bahasa pemrograman yang berjalan di...", options: ["Server", "Database", "Browser", "Compiler"], correct: 2 },
            { id: 4, question: "Tailwind CSS adalah framework yang menggunakan pendekatan...", options: ["Component-based", "Utility-first", "Atomic design", "Mobile-first"], correct: 1 },
            { id: 5, question: "React JS dikembangkan oleh...", options: ["Google", "Microsoft", "Facebook", "Twitter"], correct: 2 }
        ];

        let portfolio = {
            name: "Sulthan",
            title: "Frontend Developer Enthusiast",
            bio: "Siswa yang antusias belajar pengembangan web modern.",
            skills: ["HTML", "CSS", "JavaScript", "Tailwind", "React"],
            projects: [
                { name: "EduSmart Dashboard", desc: "Media pembelajaran interaktif", tech: "HTML, Tailwind, JS" },
                { name: "Portfolio Website", desc: "Personal branding", tech: "React, Tailwind" }
            ]
        };

        // ==================== FUNGSI UTILITY ====================
        function updateXP() {
            let total = 0;
            materiList.forEach(m => { if (m.completed) total += m.xp; });
            currentUser.xp = total;
            currentUser.level = Math.floor(total / 100) + 1;
            localStorage.setItem('userData', JSON.stringify({ currentUser, completedLessons: materiList.map(m => m.completed), portfolio }));
        }

        function loadData() {
            const saved = localStorage.getItem('userData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    currentUser = data.currentUser;
                    materiList.forEach((m, i) => m.completed = data.completedLessons[i]);
                    if (data.portfolio) portfolio = data.portfolio;
                    updateXP();
                } catch(e) {}
            }
        }

        function saveData() {
            localStorage.setItem('userData', JSON.stringify({
                currentUser,
                completedLessons: materiList.map(m => m.completed),
                portfolio
            }));
        }

        // ==================== RENDER FUNCTIONS ====================
        function renderDashboard() {
            const completedCount = materiList.filter(m => m.completed).length;
            const totalXP = currentUser.xp;
            const progressPercent = (completedCount / materiList.length) * 100;
            const nextLevelXP = (currentUser.level) * 100;
            const xpToNext = nextLevelXP - totalXP;

            document.getElementById('contentArea').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Stat Card -->
                    <div class="lg:col-span-2 space-y-5">
                        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 card-hover">
                            <h2 class="text-lg font-semibold mb-4">📊 Progress Belajar</h2>
                            <div class="flex justify-between text-sm mb-1">
                                <span>Level ${currentUser.level}</span>
                                <span>${totalXP} / ${nextLevelXP} XP</span>
                            </div>
                            <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 mb-3">
                                <div class="progress-fill bg-blue-600 h-2.5 rounded-full" style="width: ${(totalXP % 100)}%"></div>
                            </div>
                            <div class="grid grid-cols-3 gap-4 text-center mt-4">
                                <div class="p-3 bg-blue-50 dark:bg-blue-900/30 rounded-lg">
                                    <div class="text-2xl font-bold text-blue-600">${completedCount}</div>
                                    <div class="text-xs text-gray-600 dark:text-gray-400">Materi Selesai</div>
                                </div>
                                <div class="p-3 bg-green-50 dark:bg-green-900/30 rounded-lg">
                                    <div class="text-2xl font-bold text-green-600">${totalXP}</div>
                                    <div class="text-xs text-gray-600 dark:text-gray-400">Total XP</div>
                                </div>
                                <div class="p-3 bg-purple-50 dark:bg-purple-900/30 rounded-lg">
                                    <div class="text-2xl font-bold text-purple-600">${currentUser.level}</div>
                                    <div class="text-xs text-gray-600 dark:text-gray-400">Level</div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                            <h2 class="text-lg font-semibold mb-4">📚 Materi Terbaru</h2>
                            <div class="space-y-3">
                                ${materiList.slice(0, 3).map(m => `
                                    <div class="flex justify-between items-center p-3 rounded-lg bg-gray-50 dark:bg-gray-700/50 materi-item">
                                        <div>
                                            <h3 class="font-medium">${m.title}</h3>
                                            <p class="text-sm text-gray-500 dark:text-gray-400">${m.desc}</p>
                                        </div>
                                        <span class="text-xs ${m.completed ? 'text-green-600' : 'text-blue-600'}">
                                            ${m.completed ? '<i class="fas fa-check-circle"></i> Selesai' : '<i class="fas fa-play-circle"></i> Mulai'}
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Profile Sidebar -->
                    <div class="space-y-5">
                        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 text-center card-hover">
                            <div class="w-24 h-24 mx-auto bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-3xl text-white mb-3">
                                <i class="fas fa-user-graduate"></i>
                            </div>
                            <h3 class="text-xl font-bold">${portfolio.name}</h3>
                            <p class="text-gray-500 dark:text-gray-400 text-sm">${portfolio.title}</p>
                            <div class="flex justify-center gap-2 mt-3">
                                ${portfolio.skills.slice(0, 3).map(s => `<span class="px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded-full text-xs">${s}</span>`).join('')}
                            </div>
                        </div>
                        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700">
                            <h3 class="font-semibold mb-3"><i class="fas fa-trophy text-yellow-500 mr-2"></i> Pencapaian</h3>
                            <div class="flex justify-around">
                                <div class="text-center"><i class="fas fa-fire text-orange-500 text-xl"></i><p class="text-xs mt-1">${totalXP} XP</p></div>
                                <div class="text-center"><i class="fas fa-book text-blue-500 text-xl"></i><p class="text-xs mt-1">${completedCount}/5</p></div>
                                <div class="text-center"><i class="fas fa-chart-line text-green-500 text-xl"></i><p class="text-xs mt-1">Level ${currentUser.level}</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMateri() {
            document.getElementById('contentArea').innerHTML = `
                <div class="space-y-4">
                    <h1 class="text-2xl font-bold">📖 Materi Pembelajaran</h1>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${materiList.map(m => `
                            <div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm border border-gray-100 dark:border-gray-700 card-hover">
                                <div class="aspect-video bg-gray-900">
                                    <iframe class="w-full h-full" src="${m.videoUrl}" frameborder="0" allowfullscreen></iframe>
                                </div>
                                <div class="p-5">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <h3 class="text-lg font-bold">${m.title}</h3>
                                            <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">${m.desc}</p>
                                        </div>
                                        <span class="text-xs font-semibold px-2 py-1 rounded-full ${m.completed ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">
                                            ${m.completed ? '+20 XP' : 'Belum'}
                                        </span>
                                    </div>
                                    <button onclick="toggleComplete(${m.id-1})" class="mt-4 w-full py-2 rounded-lg btn-animate ${m.completed ? 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300' : 'bg-blue-600 text-white hover:bg-blue-700'}">
                                        ${m.completed ? '<i class="fas fa-check mr-1"></i> Selesai' : '<i class="fas fa-play mr-1"></i> Tandai Selesai'}
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            let score = 0;
            for (let i = 0; i < quizQuestions.length; i++) {
                if (quizAnswers[i] === quizQuestions[i].correct) score++;
            }

            document.getElementById('contentArea').innerHTML = `
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-2xl font-bold">🧠 Kuis Interaktif</h1>
                        <div class="px-4 py-2 bg-blue-100 dark:bg-blue-900/50 rounded-full">
                            <span class="font-bold">Skor: ${score}/${quizQuestions.length}</span>
                        </div>
                    </div>
                    <div class="space-y-6">
                        ${quizQuestions.map((q, idx) => `
                            <div class="border-b border-gray-200 dark:border-gray-700 pb-5">
                                <p class="font-semibold mb-3">${idx+1}. ${q.question}</p>
                                <div class="space-y-2 ml-4">
                                    ${q.options.map((opt, optIdx) => `
                                        <div onclick="selectAnswer(${idx}, ${optIdx})" class="quiz-option p-2 rounded-lg ${quizAnswers[idx] === optIdx ? 'bg-blue-100 dark:bg-blue-900/50 border-l-4 border-blue-600' : 'hover:bg-gray-100 dark:hover:bg-gray-700'}">
                                            <span class="text-sm">${String.fromCharCode(65+optIdx)}. ${opt}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="submitQuiz()" class="mt-6 w-full bg-green-600 text-white py-3 rounded-lg font-semibold btn-animate">
                        <i class="fas fa-check-circle mr-2"></i> Submit Jawaban
                    </button>
                </div>
            `;
        }

        function renderPortfolio() {
            document.getElementById('contentArea').innerHTML = `
                <div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm">
                    <div class="h-32 bg-gradient-to-r from-blue-600 to-purple-600"></div>
                    <div class="px-6 pb-6 relative">
                        <div class="w-28 h-28 -mt-14 mx-auto bg-white dark:bg-gray-700 rounded-full border-4 border-white dark:border-gray-800 flex items-center justify-center text-3xl shadow-lg">
                            <i class="fas fa-user-circle text-gray-400 text-5xl"></i>
                        </div>
                        <div class="text-center mt-3">
                            <h2 class="text-2xl font-bold">${portfolio.name}</h2>
                            <p class="text-gray-500 dark:text-gray-400">${portfolio.title}</p>
                            <p class="mt-2 text-gray-600 dark:text-gray-300 max-w-md mx-auto">${portfolio.bio}</p>
                        </div>
                        <div class="flex flex-wrap justify-center gap-2 mt-4">
                            ${portfolio.skills.map(s => `<span class="px-3 py-1 bg-gray-100 dark:bg-gray-700 rounded-full text-sm"><i class="fas fa-code mr-1"></i>${s}</span>`).join('')}
                        </div>
                        <div class="mt-6">
                            <h3 class="font-semibold text-lg mb-3"><i class="fas fa-folder-open mr-2"></i> Proyek</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${portfolio.projects.map(p => `
                                    <div class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 card-hover">
                                        <h4 class="font-semibold">${p.name}</h4>
                                        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${p.desc}</p>
                                        <span class="inline-block mt-2 text-xs px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded">${p.tech}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== INTERAKSI ====================
        function toggleComplete(index) {
            materiList[index].completed = !materiList[index].completed;
            updateXP();
            saveData();
            renderMateri();
        }

        function selectAnswer(questionIdx, optionIdx) {
            quizAnswers[questionIdx] = optionIdx;
            renderQuiz();
        }

        function submitQuiz() {
            let score = 0;
            for (let i = 0; i < quizQuestions.length; i++) {
                if (quizAnswers[i] === quizQuestions[i].correct) score++;
            }
            alert(`🎉 Skor Anda: ${score}/${quizQuestions.length}\n${score === 5 ? 'Sempurna! Selamat!' : 'Terus belajar dan coba lagi!'}`);
        }

        // ==================== TAB NAVIGATION ====================
        let currentTab = 'dashboard';
        function setActiveTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.removeAttribute('data-active'));
            if (tab === 'dashboard') {
                document.getElementById('tabDashboard').setAttribute('data-active', 'true');
                renderDashboard();
            } else if (tab === 'materi') {
                document.getElementById('TabMateri').setAttribute('data-active', 'true');
                renderMateri();
            } else if (tab === 'quiz') {
                document.getElementById('tabQuiz').setAttribute('data-active', 'true');
                renderQuiz();
            } else if (tab === 'portfolio') {
                document.getElementById('tabPortfolio').setAttribute('data-active', 'true');
                renderPortfolio();
            }
        }

        // ==================== DARK MODE ====================
        let isDark = localStorage.getItem('darkMode') === 'true';
        function applyDarkMode() {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('darkIcon').className = 'fas fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('darkIcon').className = 'fas fa-moon';
            }
            localStorage.setItem('darkMode', isDark);
        }
        function toggleDarkMode() {
            isDark = !isDark;
            applyDarkMode();
        }

        // ==================== INIT ====================
        function init() {
            loadData();
            applyDarkMode();
            setActiveTab('dashboard');
            document.getElementById('darkModeToggle').addEventListener('click', toggleDarkMode);
            document.getElementById('tabDashboard').addEventListener('click', () => setActiveTab('dashboard'));
            document.getElementById('TabMateri').addEventListener('click', () => setActiveTab('materi'));
            document.getElementById('tabQuiz').addEventListener('click', () => setActiveTab('quiz'));
            document.getElementById('tabPortfolio').addEventListener('click', () => setActiveTab('portfolio'));
            document.getElementById('logoutBtn').addEventListener('click', () => {
                if(confirm('Yakin ingin keluar?')) location.reload();
            });
            window.toggleComplete = toggleComplete;
            window.selectAnswer = selectAnswer;
            window.submitQuiz = submitQuiz;
        }
        init();
    </script>
</body>
</html>
