<!DOCTYPE html>
<html>
<head>
  <title>Contoh Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        .container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        }
        
        .box {
          width: 80px;
          height: 80px;
          background-color: #4CAF50;
          color: white;
          text-align: center;
          line-height: 80px;
        }
     </style>

<div class="container">
    <div class="box">box1</div>
    <div class="box">box2</div>
    <div class="box">box3</div>
</div>

</body>
</html>
