<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning PPLG</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to right, #e3f2fd, #ffffff);
}

/* Navbar */
.navbar {
    background: linear-gradient(45deg, #007bff, #00c6ff);
}

/* Content Animation */
.content {
    padding: 30px;
    animation: fade 0.5s ease;
}

@keyframes fade {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Card Style */
.card {
    border: none;
    border-radius: 15px;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

/* Button */
.btn-custom {
    border-radius: 30px;
    padding: 8px 20px;
}

/* Title */
h2 {
    font-weight: 700;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <h4 class="text-white">E-Learning PPLG</h4>
        <div>
            <button class="btn btn-light btn-custom me-2" onclick="showPage('dashboard')">Dashboard</button>
            <button class="btn btn-light btn-custom me-2" onclick="showPage('materi')">Materi</button>
            <button class="btn btn-light btn-custom" onclick="showPage('profil')">Profil</button>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container content" id="content"></div>

<script>
function showPage(page) {
    let content = document.getElementById("content");

    if(page === "dashboard") {
        content.innerHTML = `
        <div class="text-center mb-5">
            <h2>Selamat Datang 👋</h2>
            <p>Belajar HTML jadi lebih mudah dan menyenangkan</p>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>📚 Materi</h5>
                    <p>Pelajari dasar HTML dari awal</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>💡 Interaktif</h5>
                    <p>Tampilan modern dan mudah digunakan</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h5>🚀 Cepat</h5>
                    <p>Tanpa reload halaman</p>
                </div>
            </div>
        </div>
        `;
    }

    else if(page === "materi") {
        content.innerHTML = `
        <h2 class="mb-4">Materi HTML</h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Apa itu HTML?</h5>
                    <p>HTML adalah bahasa untuk membuat struktur website.</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Tag Dasar</h5>
                    <p>&lt;html&gt;, &lt;head&gt;, &lt;body&gt;</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Contoh</h5>
                    <pre>&lt;h1&gt;Hello World&lt;/h1&gt;</pre>
                </div>
            </div>

        </div>
        `;
    }

    else if(page === "profil") {
        content.innerHTML = `
        <div class="card p-4 text-center">
            <h2>Profil</h2>
            <p><b>Nama:</b> Sulthan</p>
            <p><b>Kelas:</b> PPLG</p>
            <p>Website ini dibuat untuk media pembelajaran HTML.</p>
        </div>
        `;
    }
}

// Default
showPage('dashboard');
</script>

</body>
</html>
